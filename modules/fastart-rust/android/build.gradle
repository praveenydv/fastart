plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.fastart'
version = '1.0.0'

android {
  namespace "com.fastart"
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
  sourceSets {
    main {
      // Keep the Rust library in the Expo module only. Importing the generated
      // app jniLibs directory as well causes Gradle to merge the same .so twice.
      jniLibs.srcDirs = ['src/main/jniLibs']
    }
  }
}

dependencies {
  implementation 'com.facebook.react:react-android'
}
