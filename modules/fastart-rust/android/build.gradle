plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.fastart'
version = '1.0.0'

android {
  namespace "com.fastart"
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
  sourceSets {
    main {
      jniLibs.srcDirs = [
        'src/main/jniLibs',
        file("../../../rust/target/release"),
        file("../../../android/app/src/main/jniLibs")
      ]
    }
  }
}

dependencies {
  implementation 'com.facebook.react:react-android'
}
