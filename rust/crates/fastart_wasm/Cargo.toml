[package]
name = "fastart_wasm"
version = "1.0.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
fastart_core = { path = "../fastart_core", default-features = false }
wasm-bindgen = "0.2"
serde_json = "1.0"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["console"] }
