[package]
name = "fastart_core"
version = "1.0.0"
edition = "2021"
authors = ["FastArt Team"]
description = "FastArt High-Performance Mobile Video & Audio Processing Engine in Rust"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
getrandom = "0.4"
byteorder = "1.5"
rayon = { version = "1.10", optional = true }
tract-onnx = { version = "0.23.7", default-features = false }
symphonia = { version = "0.6.1", default-features = false, features = ["aac", "alac", "flac", "mp3", "isomp4", "wav", "pcm", "ogg", "vorbis", "opt-simd"] }

[features]
default = ["parallel"]
parallel = ["dep:rayon"]
