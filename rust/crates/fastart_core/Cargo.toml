[package]
name = "fastart_core"
version = "1.0.0"
edition = "2021"
authors = ["FastArt Team"]
description = "FastArt High-Performance Mobile Video & Audio Processing Engine in Rust"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
byteorder = "1.5"
rayon = { version = "1.10", optional = true }

[features]
default = ["parallel"]
parallel = ["dep:rayon"]
