name: Deploy to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'yarn'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'rust -> rust/target'

      - name: Install dependencies
        run: yarn install --frozen-lockfile --ignore-engines

      - name: Download AI Models
        run: node scripts/download-models.js

      - name: Build WebAssembly and copy runtime assets
        env:
          CARGO_TERM_COLOR: always
        run: yarn run build:wasm

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Export Expo Web
        env:
          EXPO_BASE_URL: ${{ steps.pages.outputs.base_path }}
        run: yarn expo export -p web

      - name: Configure SPA routing and Jekyll bypass
        run: |
          touch dist/.nojekyll
          cp dist/index.html dist/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
