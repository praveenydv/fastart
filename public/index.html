<!doctype html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>%WEB_TITLE%</title>
    <!-- Enable Cross-Origin Isolation (SharedArrayBuffer & multi-threaded WebAssembly / WebGPU) on GitHub Pages -->
    <script>
      (function() {
        if (window.crossOriginIsolated) return;
        var base = '';
        var baseTag = document.querySelector('base[href]');
        if (baseTag) {
          base = baseTag.getAttribute('href') || '';
        } else if (window.location.hostname.endsWith('github.io')) {
          var segments = window.location.pathname.split('/').filter(Boolean);
          if (segments.length > 0) {
            base = '/' + segments[0] + '/';
          }
        }
        if (base && !base.endsWith('/')) base += '/';
        var script = document.createElement('script');
        script.src = base + 'coi-serviceworker.js';
        document.head.appendChild(script);
      })();
    </script>
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript> You need to enable JavaScript to run this app. </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>
